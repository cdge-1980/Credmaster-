<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovações | CredMaster</title><style>body{margin:0;background:#f2f5fa;color:#15223a;font:16px system-ui,Arial}header{background:#173568;color:white;padding:20px}main{max-width:680px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px}input,button{padding:12px;border-radius:8px;font:inherit}input{display:block;width:90%;margin:8px 0}button{background:#173568;color:white;border:0;margin:4px;cursor:pointer}.green{background:#16744f}.red{background:#a52336}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#52637a}</style></head><body><header><h1>CredMaster — Solicitações</h1></header><main><div class="card" id="login"><h2>Acesso do administrador</h2><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button id="entrar">Entrar</button><p id="loginmsg"></p></div><section id="area" hidden><button id="sair">Sair</button><p>As solicitações aprovadas são adicionadas à aba Clientes do CredMaster. Os dados completos da solicitação permanecem nesta área restrita.</p><div id="lista"></div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
import {getFirestore,collection,onSnapshot,doc,runTransaction,updateDoc} from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';
const config={apiKey:'AIzaSyBABu6lN9Mwr5gizgXEA5WCMkXgcPD0YZY',authDomain:'credmaster-476d5.firebaseapp.com',projectId:'credmaster-476d5',appId:'1:115740048120:web:542f876e634cff2861990d'},owner='EVKdQFXbYNXprvnhX6zyDRZOemE3';const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let unsub=()=>{},solicitacoes=[];const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#entrar').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#email').value,$('#senha').value)}catch(e){$('#loginmsg').textContent='Falha no login. Confira os dados.'}};
$('#sair').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{unsub();$('#login').hidden=!!u&&u.uid===owner;$('#area').hidden=!u||u.uid!==owner;if(!u||u.uid!==owner){if(u)signOut(auth);return}unsub=onSnapshot(collection(db,'solicitacoes_cadastro'),snap=>{solicitacoes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds??0)-(a.criadoEm?.seconds??0));render()},()=>{$('#lista').textContent='Não foi possível carregar as solicitações. Confira as regras.'})});
function render(){$('#lista').innerHTML='';for(const s of solicitacoes){const el=document.createElement('div');el.className='card';el.innerHTML=`<h2>${esc(s.nome)}</h2><strong>${esc(s.status)}</strong><pre>CPF: ${esc(s.cpf)}\nNascimento: ${esc(s.nascimento)}\nTelefone: ${esc(s.telefone)}\nEndereço: ${esc(s.endereco)}, ${esc(s.bairro)}, ${esc(s.cidade)} - ${esc(s.cep)}\nSituação: ${esc(s.situacao)}\nEmpresa: ${esc(s.empresa)}\nProfissão: ${esc(s.profissao)}\nRenda: ${esc(s.renda)}\nAvalista: ${esc(s.avalistaNome)}\nTelefone do avalista: ${esc(s.avalistaTelefone)}</pre>`;if(s.status==='pendente'){const a=document.createElement('button'),r=document.createElement('button');a.textContent='Aprovar';a.className='green';r.textContent='Recusar';r.className='red';a.onclick=()=>decidir(s,'aprovado');r.onclick=()=>decidir(s,'recusado');el.append(a,r)}$('#lista').append(el)}if(!solicitacoes.length)$('#lista').textContent='Nenhuma solicitação recebida.'}
async function decidir(s,status){if(!confirm(`${status==='aprovado'?'Aprovar':'Recusar'} solicitação de ${s.nome}?`))return;try{const ref=doc(db,'solicitacoes_cadastro',s.id);if(status==='recusado'){await updateDoc(ref,{status});return}const main=doc(db,'credmaster',owner);await runTransaction(db,async tx=>{const [req,state]=await Promise.all([tx.get(ref),tx.get(main)]);if(!req.exists()||req.data().status!=='pendente')throw Error('Solicitação já processada');const data=state.exists()?state.data():{revision:0,clientes:[],emprestimos:[],pagamentos:[],movimentosSaldo:[]};const cpf=req.data().cpf;const existing=data.clientes.find(c=>String(c.documento??'').replace(/\D/g,'')===cpf);if(existing)throw Error('CPF já cadastrado no CredMaster');const id=Math.max(0,...data.clientes.map(c=>c.id))+1;data.clientes.push({id,nome:s.nome,documento:cpf,endereco:`${s.endereco}, ${s.bairro}, ${s.cidade}, CEP ${s.cep}`,status:'aprovado',solicitacaoId:s.id});data.revision=(data.revision??0)+1;tx.set(main,data);tx.update(ref,{status:'aprovado',clienteId:id})});alert('Aprovado e incluído na aba Clientes. Atualize o CredMaster para conferir.')}catch(e){alert('Não foi possível concluir: '+e.message)}}
</script></body></html>
