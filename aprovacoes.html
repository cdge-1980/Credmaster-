<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovações | CredMaster</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#15223a;font:16px system-ui,Arial}header{background:#173568;color:white;padding:20px}main{max-width:680px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:12px;margin-bottom:12px}input,button,.navlink{padding:12px;border-radius:8px;font:inherit}input{display:block;width:100%;margin:8px 0}button,.navlink{background:#173568;color:white;border:0;margin:4px;cursor:pointer;text-decoration:none;display:inline-block}.green{background:#16744f}.red{background:#a52336}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#52637a}.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.doc{border:1px solid #d5dce8;border-radius:10px;padding:10px;min-width:0}.doc strong{display:block;margin-bottom:8px}.doc img{width:100%;height:auto;max-height:300px;object-fit:contain;background:#f2f5fa;border-radius:6px}.doc a{display:block;margin-top:8px;overflow-wrap:anywhere}.warning{color:#9b2534}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{flex:1;min-width:130px}.status{display:inline-block;margin:6px 0;padding:6px 10px;border-radius:6px;background:#e7edf7}</style></head><body>
<header><h1>CredMaster — Solicitações</h1></header><main><div class="card" id="login"><h2>Acesso do administrador</h2><input id="email" type="email" placeholder="E-mail" autocomplete="username"><input id="senha" type="password" placeholder="Senha" autocomplete="current-password"><button id="entrar">Entrar</button><p id="loginmsg" role="status"></p></div><section id="area" hidden><a class="navlink" href="./index.html">← Voltar ao CredMaster</a><button id="sair">Sair</button><p>Solicitações aprovadas são adicionadas à aba Clientes. Dados completos e anexos permanecem nesta área restrita.</p><div id="lista"></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
import {getFirestore,collection,onSnapshot,doc,runTransaction} from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';
const config={apiKey:'AIzaSyBABu6lN9Mwr5gizgXEA5WCMkXgcPD0YZY',authDomain:'credmaster-476d5.firebaseapp.com',projectId:'credmaster-476d5',appId:'1:115740048120:web:542f876e634cff2861990d'},owner='EVKdQFXbYNXprvnhX6zyDRZOemE3';
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let unsub=()=>{},solicitacoes=[];const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#entrar').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#email').value,$('#senha').value)}catch(e){$('#loginmsg').textContent='Falha no login. Confira os dados.'}};
$('#sair').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{unsub();$('#login').hidden=!!u&&u.uid===owner;$('#area').hidden=!u||u.uid!==owner;if(!u||u.uid!==owner){if(u)signOut(auth);return}unsub=onSnapshot(collection(db,'solicitacoes_cadastro'),snap=>{solicitacoes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds??0)-(a.criadoEm?.seconds??0));render()},()=>{$('#lista').textContent='Não foi possível carregar as solicitações. Confira as regras.'})});
const nomesDocs=[['frente','Documento — frente'],['verso','Documento — verso'],['endereco','Comprovante de endereço'],['renda','Comprovante de renda']];
function anexosNaTela(s,el){const box=document.createElement('div');box.className='docs';const anexos=s.anexos;if(!anexos||typeof anexos!=='object'){const p=document.createElement('p');p.className='warning';p.textContent='Esta solicitação não contém imagens salvas.';el.append(p);return}for(const [chave,titulo] of nomesDocs){const valor=anexos[chave];if(!valor){if(chave!=='renda'){const p=document.createElement('p');p.className='warning';p.textContent=titulo+': não encontrado';el.append(p)}continue}const item=document.createElement('div');item.className='doc';const rotulo=document.createElement('strong');rotulo.textContent=titulo;item.append(rotulo);if(typeof valor==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(valor)&&valor.length<=300000){const img=document.createElement('img');img.src=valor;img.alt=titulo;img.loading='lazy';const link=document.createElement('a');link.href=valor;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Abrir imagem';item.append(img,link)}else{const p=document.createElement('p');p.className='warning';p.textContent='Imagem em formato inesperado. Não foi exibida.';item.append(p)}box.append(item)}el.append(box)}
function render(){$('#lista').replaceChildren();for(const s of solicitacoes){const el=document.createElement('div');el.className='card';const status=String(s.status??'pendente').toLowerCase().trim();el.innerHTML=`<h2>${esc(s.nome)}</h2><strong class="status">${esc(status)}</strong><pre>CPF: ${esc(s.cpf)}\nNascimento: ${esc(s.nascimento)}\nTelefone: ${esc(s.telefone)}\nEndereço: ${esc(s.endereco)}, ${esc(s.bairro)}, ${esc(s.cidade)} - ${esc(s.cep)}\nSituação: ${esc(s.situacao)}\nEmpresa: ${esc(s.empresa)}\nProfissão: ${esc(s.profissao)}\nRenda: ${esc(s.renda)}\nAvalista: ${esc(s.avalistaNome)}\nTelefone do avalista: ${esc(s.avalistaTelefone)}</pre>`;anexosNaTela(s,el);if(status!=='aprovado'){const actions=document.createElement('div');actions.className='actions';const a=document.createElement('button');a.textContent=status==='recusado'?'Reconsiderar e aprovar':'Aprovar';a.className='green';a.onclick=()=>decidir(s,'aprovado');actions.append(a);if(status!=='recusado'){const r=document.createElement('button');r.textContent='Recusar';r.className='red';r.onclick=()=>decidir(s,'recusado');actions.append(r)}el.append(actions)}$('#lista').append(el)}if(!solicitacoes.length)$('#lista').textContent='Nenhuma solicitação recebida.'}
async function decidir(s,status){if(!confirm(`${status==='aprovado'?'Aprovar':'Recusar'} solicitação de ${s.nome}?`))return;try{const ref=doc(db,'solicitacoes_cadastro',s.id);const main=doc(db,'credmaster',owner);await runTransaction(db,async tx=>{const req=await tx.get(ref);if(!req.exists())throw Error('Solicitação não encontrada');const atual=String(req.data().status??'pendente').toLowerCase().trim();if(atual==='aprovado')throw Error('Solicitação já aprovada');if(status==='recusado'){tx.update(ref,{status:'recusado'});return}const state=await tx.get(main);if(!state.exists())throw Error('Base principal do CredMaster não encontrada. Nenhum cadastro foi alterado.');const data=state.data();if(!Array.isArray(data.clientes))throw Error('Formato da lista de clientes não reconhecido. Nenhum cadastro foi alterado.');const cpf=String(req.data().cpf??'').replace(/\D/g,'');if(!cpf)throw Error('CPF não informado');const existing=data.clientes.find(c=>String(c.documento??'').replace(/\D/g,'')===cpf);if(existing)throw Error('CPF já cadastrado no CredMaster');const id=Math.max(0,...data.clientes.map(c=>Number(c.id)||0))+1;const clientes=[...data.clientes,{id,nome:req.data().nome,documento:cpf,endereco:`${req.data().endereco??''}, ${req.data().bairro??''}, ${req.data().cidade??''}, CEP ${req.data().cep??''}`,status:'aprovado',solicitacaoId:s.id}];tx.update(main,{clientes,revision:(Number(data.revision)||0)+1});tx.update(ref,{status:'aprovado',clienteId:id})});alert(status==='aprovado'?'Aprovado e incluído na aba Clientes. Volte ao CredMaster para conferir.':'Solicitação recusada.')}catch(e){alert('Não foi possível concluir: '+e.message)}}
</script></body></html>
