
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CredMaster • Demonstração v2</title><style>:root{font-family:system-ui,Arial;background:#f2f5fa;color:#15223a}*{box-sizing:border-box}body{margin:0}header{background:#173568;color:white;padding:22px 18px}h1{margin:0;font-size:26px}small{opacity:.8}main{max-width:680px;margin:auto;padding:15px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}button{border:0;border-radius:10px;padding:12px;background:#173568;color:white;font-weight:700;cursor:pointer}nav button{font-size:12px;padding:11px 4px}button.secondary{background:#e7edf7;color:#173568}button.green{background:#16744f}button.red{background:#a52336}button:disabled{opacity:.4}.card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #142b4d12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#e9eff9;border-radius:12px;padding:13px}.metric b{display:block;font-size:19px;margin-top:5px}label{display:block;font-weight:650;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #c7d0df;border-radius:9px;font-size:16px}p{line-height:1.5}.muted{color:#65758b;font-size:13px}.danger{color:#b02036;font-weight:750}.good{color:#16744f;font-weight:700}.line{border-top:1px solid #e8edf4;margin:12px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none}.pill{padding:4px 8px;border-radius:8px;background:#edf1f7;font-size:12px}footer{padding:10px 15px 30px;text-align:center;color:#65758b;font-size:12px}</style></head><body><header><h1>▣ CredMaster</h1><small>Gestão de Empréstimos e Cobranças • Protótipo local v2</small></header><main><nav><button onclick="tab('emprestimos')">＋ Novo empréstimo</button><button onclick="tab('clientes')">Clientes</button><button onclick="tab('emprestimos')">Empréstimos</button><button onclick="tab('cobrancas')">Cobranças</button><button onclick="tab('relatorios')">Relatórios</button><button onclick="tab('dados')">Dados</button></nav><div id="view"></div></main><footer>DEMONSTRAÇÃO • Dados guardados somente neste navegador • Não usar com dados reais</footer><script>
const KEY='jurocontrol_demo_v1';const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=s=>s?String(s).split('-').reverse().join('/'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const init=()=>({clientes:[{id:1,nome:'João Silva (fictício)',status:'aprovado'},{id:2,nome:'Maria Oliveira (fictícia)',status:'pendente'}],emprestimos:[],pagamentos:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||init()}catch(e){db=init()}let current='emprestimos';const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const get=id=>db.clientes.find(c=>c.id===id);const juros=e=>e.valor*e.taxa/100;const days=s=>Math.max(0,Math.floor((new Date(today()+'T12:00:00')-new Date(s+'T12:00:00'))/86400000));const atraso=e=>days(e.vencimento);const multa=e=>atraso(e)*10;const pending=e=>!e.quitado;const nextDue=s=>{let d=new Date(s+'T12:00:00');const original=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const month=d.getMonth();d.setMonth(month+1);d.setDate(0);d.setDate(Math.min(original,d.getDate()));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const box=(title,body)=>`<section class="card"><h3>${title}</h3>${body}</section>`;function tab(t){current=t;render()}function render(){const v=document.getElementById('view');if(current==='inicio'){let active=db.emprestimos.filter(pending);v.innerHTML=`<div class="grid"><div class="metric">Principal ativo<b>${money(active.reduce((a,e)=>a+e.valor,0))}</b></div><div class="metric">Juros recebidos<b>${money(db.pagamentos.reduce((a,p)=>a+p.juros,0))}</b></div><div class="metric">Juros pendentes<b>${money(active.reduce((a,e)=>a+juros(e),0))}</b></div><div class="metric">Cobranças atrasadas<b>${active.filter(e=>atraso(e)>0).length}</b></div></div>`+box('Situação',`<p>${db.clientes.filter(c=>c.status==='pendente').length} cadastro(s) aguardando aprovação.</p><p>${active.length} empréstimo(s) ativo(s).</p><p class="muted">Os juros não reduzem o principal. O cliente quita o principal quando desejar.</p>`)}else if(current==='clientes'){v.innerHTML=box('Novo cadastro para análise',`<form onsubmit="addClient(event)"><label>Nome fictício</label><input name="nome" required maxlength="100" placeholder="Nome do cliente"><button style="margin-top:12px">Enviar para aprovação</button></form>`)+db.clientes.map(c=>box(esc(c.nome),`<p class="${c.status==='pendente'?'danger':c.status==='aprovado'?'good':'muted'}">${c.status.toUpperCase()}</p>${c.status==='pendente'?`<div class="actions"><button class="green" onclick="clientStatus(${c.id},'aprovado')">Aprovar</button><button class="red" onclick="clientStatus(${c.id},'recusado')">Recusar</button></div>`:''}`)).join('')}else if(current==='emprestimos'){const opts=db.clientes.filter(c=>c.status==='aprovado').map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');v.innerHTML=box('Cadastrar empréstimo de teste',`<form onsubmit="addLoan(event)"><label>Cliente aprovado</label><select name="cid" required>${opts}</select><label>Valor principal (R$)</label><input name="valor" type="number" min="0.01" step="0.01" required><label>Juros ao mês (%)</label><input name="taxa" type="number" min="0" max="100" step="0.01" required><label>Data da entrega do dinheiro</label><input name="data" type="date" value="${today()}" required><button style="margin-top:12px" ${opts?'':'disabled'}>Cadastrar empréstimo</button></form><p class="muted">O primeiro vencimento será um mês após a data informada. Sem número fixo de parcelas.</p>`)+db.emprestimos.map(e=>box(`Empréstimo Nº ${String(e.id).padStart(3,'0')}`,`<p>${esc(get(e.cid)?.nome)} • Principal ${money(e.valor)}</p><p>Juros mensais ${e.taxa}% = ${money(juros(e))}</p><p>Próximo vencimento ${date(e.vencimento)}</p><p class="${e.quitado?'good':'muted'}">${e.quitado?'QUITADO':'ATIVO'}</p>${!e.quitado?`<button class="secondary" onclick="settle(${e.id})">Quitar principal</button>`:''}`)).join('')}else if(current==='cobrancas'){v.innerHTML=db.emprestimos.filter(pending).map(e=>box(`${esc(get(e.cid)?.nome)} • Nº ${String(e.id).padStart(3,'0')}`,`<p>Vencimento: ${date(e.vencimento)}</p><p class="${atraso(e)?'danger':''}">${atraso(e)} dia(s) de atraso</p><p>Juros: ${money(juros(e))}<br>Encargo simulado: ${money(multa(e))}</p><h3>Total: ${money(juros(e)+multa(e))}</h3><div class="actions"><button class="green" onclick="pay(${e.id})">PAGOU</button><button class="secondary" onclick="whatsapp(${e.id})">WhatsApp</button></div>`)).join('')||box('Sem cobranças','<p>Nenhum empréstimo ativo. Cadastre um empréstimo de teste.</p>')}else if(current==='relatorios'){v.innerHTML=box('Histórico de pagamentos',db.pagamentos.length?db.pagamentos.slice().reverse().map(p=>`<div class="line"></div><p><b>${esc(get(p.cid)?.nome)}</b> • Nº ${String(p.eid).padStart(3,'0')}<br>Recebido em ${date(p.data)}<br>Juros ${money(p.juros)} • Encargos ${money(p.multa)}</p>`).join(''):'<p>Sem pagamentos registrados.</p>')+box('Resumo',`<p>Juros recebidos: <b>${money(db.pagamentos.reduce((a,p)=>a+p.juros,0))}</b></p><p>Encargos recebidos: <b>${money(db.pagamentos.reduce((a,p)=>a+p.multa,0))}</b></p><p>Principal ativo: <b>${money(db.emprestimos.filter(pending).reduce((a,e)=>a+e.valor,0))}</b></p>`)}else{v.innerHTML=box('Armazenamento e segurança',`<p class="danger">Este é apenas um protótipo local. Não tem login, biometria, nuvem nem proteção adequada para documentos pessoais.</p><p>Se limpar os dados do navegador ou trocar de celular, poderá perder os registros.</p><button class="secondary" onclick="exportDemo()">Baixar cópia dos dados de teste (JSON)</button><p class="muted">A cópia não é criptografada. Não armazene dados pessoais reais nesta versão.</p><button class="red" onclick="reset()">Reiniciar demonstração</button>`)} }
function addClient(ev){ev.preventDefault();const f=ev.target;db.clientes.push({id:Math.max(0,...db.clientes.map(c=>c.id))+1,nome:f.nome.value.trim(),status:'pendente'});save()}function clientStatus(id,status){db.clientes.find(c=>c.id===id).status=status;save()}function addLoan(ev){ev.preventDefault();const f=ev.target;const valor=Number(f.valor.value),taxa=Number(f.taxa.value),cid=Number(f.cid.value);if(!get(cid)||get(cid).status!=='aprovado'||valor<=0||taxa<0||taxa>100)return alert('Confira os dados.');db.emprestimos.push({id:Math.max(0,...db.emprestimos.map(e=>e.id))+1,cid,valor,taxa,data:f.data.value,vencimento:nextDue(f.data.value),quitado:false});save()}function pay(id){let e=db.emprestimos.find(x=>x.id===id);if(!e||e.quitado)return;let j=juros(e),m=multa(e);if(!confirm(`Confirmar recebimento de ${money(j+m)}?\nJuros: ${money(j)}\nEncargo: ${money(m)}\nO principal de ${money(e.valor)} permanece devido.`))return;db.pagamentos.push({eid:e.id,cid:e.cid,juros:j,multa:m,data:today()});e.vencimento=nextDue(e.vencimento);save()}function settle(id){let e=db.emprestimos.find(x=>x.id===id);if(confirm(`Confirmar recebimento do principal de ${money(e.valor)} e quitação do empréstimo Nº ${String(e.id).padStart(3,'0')}?\nVerifique juros pendentes separadamente.`)){e.quitado=true;save()}}function whatsapp(id){let e=db.emprestimos.find(x=>x.id===id);let t=`Olá, ${get(e.cid).nome}!\nEmpréstimo Nº ${String(e.id).padStart(3,'0')}\nData do empréstimo: ${date(e.data)}\nValor emprestado: ${money(e.valor)}\nVencimento dos juros: ${date(e.vencimento)}\nJuros mensais: ${money(juros(e))}\nDias de atraso: ${atraso(e)}\nEncargos simulados: ${money(multa(e))}\nTotal: ${money(juros(e)+multa(e))}\nCaso já tenha pago, favor enviar comprovante.`;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}function exportDemo(){const blob=new Blob([JSON.stringify({versao:'CredMaster demonstracao 2',exportadoEm:new Date().toISOString(),dados:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='credmaster-teste-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function reset(){if(confirm('Apagar todos os dados de teste deste navegador?')){db=init();save()}}render();
</script></body></html>
