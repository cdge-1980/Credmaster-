<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CredMaster</title>
  <link rel="icon" type="image/png" href="./COFRE.png">
<link rel="apple-touch-icon" href="./COFRE.png">
<meta name="theme-color" content="#173568">
  <style>
    :root { font-family: system-ui, Arial, sans-serif; background: #f2f5fa; color: #15223a; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    header { background: #173568; color: white; padding: 22px 18px; }
    h1 { margin: 0; font-size: 26px; }
    small { opacity: .85; }
    main, #login { max-width: 680px; margin: auto; padding: 15px; }
    #login { max-width: 420px; margin-top: 18px; }
    nav { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; margin-bottom: 15px; }
    nav button { grid-column: span 2; font-size: 13px; padding: 11px 4px; overflow-wrap: anywhere; }
    nav .sector-tab { grid-column: span 3; min-height: 72px; padding: 10px 6px; }
    .sector-tab span { display: block; }
    button { border: 0; border-radius: 10px; padding: 12px; background: #173568; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .secondary { background: #e7edf7; color: #173568; }
    .green { background: #16744f; }
    .red { background: #a52336; }
    .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 10px #142b4d12; }
    .card h2 { font-size: 1.2rem; }
    label { display: block; font-weight: 650; margin: 10px 0 5px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #c7d0df; border-radius: 9px; font-size: 16px; }
    .balance-note-input { width: 100%; padding: 12px; border: 1px solid #c7d0df; border-radius: 9px; font: inherit; resize: vertical; }
    form button { margin-top: 12px; }
    p { line-height: 1.5; }
    .muted { color: #55657a; font-size: 14px; }
    .danger { color: #b02036; font-weight: 750; }
    #overdue-alert { margin-bottom: 15px; padding: 14px 16px; border: 2px solid #b02036; border-radius: 12px; background: #fff0f1; color: #82192b; }
    #overdue-alert h2 { margin: 0 0 8px; font-size: 1.15rem; }
    #overdue-alert ul { margin: 0; padding-inline-start: 22px; line-height: 1.5; overflow-wrap: anywhere; }
    #overdue-alert li + li { margin-top: 5px; }
    #overdue-alert mark { background: #ffd6dc; color: inherit; font-weight: 750; }
    .good { color: #146443; font-weight: 700; }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .actions button { flex: 1; }
    #status { margin: 0 0 12px; }
    #logout { margin-bottom: 15px; }
    article + article { border-top: 1px solid #e8edf4; }
    .balance-actions { display: grid; gap: 12px; }
    .balance-actions summary { cursor: pointer; font-weight: 650; }
    .balance-history { padding-inline-start: 22px; line-height: 1.6; }
    .balance-note { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>CredMaster</h1>
    <small>Gestão de empréstimos e cobranças</small>
  </header>
  <section id="login">
    <form id="login-form" class="card">
      <h2>Entrar no CredMaster</h2>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="login-button" disabled>Entrar</button>
      <button id="reset-password" class="secondary" type="button" disabled>Esqueci minha senha</button>
      <p id="login-message" role="status">Carregando login…</p>
    </form>
  </section>
  <main hidden>
    <button id="logout" class="secondary" type="button">Sair</button>
    <nav aria-label="Seções do CredMaster">
      <button type="button" data-tab="novo">＋ Novo empréstimo</button>
      <button type="button" data-tab="clientes">Clientes</button>
      <button type="button" data-tab="emprestimos">Empréstimos</button>
      <button type="button" data-tab="cobrancas">Cobranças</button>
      <button type="button" data-tab="relatorios">Relatórios</button>
      <button type="button" data-tab="dados">Dados</button>
      <button type="button" class="sector-tab" data-tab="injecao">
        <span>Valores em aberto</span>
        <span>Injeção</span>
        <span>MinasMolde</span>
      </button>
      <button type="button" class="sector-tab" data-tab="ferramentaria">
        <span>Valores em aberto</span>
        <span>Ferramentaria</span>
        <span>MinasMolde</span>
      </button>
    </nav>
    <section id="overdue-alert" aria-labelledby="overdue-title" hidden>
      <h2 id="overdue-title">Atenção: cobranças em atraso</h2>
      <ul id="overdue-list"></ul>
    </section>
    <p id="status" role="status"></p>
    <div id="view"></div>
  </main>
  <noscript>Ative o JavaScript para entrar no CredMaster.</noscript>
  <script type="module">
    const sdk = "https://www.gstatic.com/firebasejs/12.11.0/";
    const pixKey = "ee38de20-a711-438f-bef5-5642a2339d76";
    const ownerUid = "EVKdQFXbYNXprvnhX6zyDRZOemE3";
    const config = {
      apiKey: "AIzaSyBABu6lN9Mwr5gizgXEA5WCMkXgcPD0YZY",
      authDomain: "credmaster-476d5.firebaseapp.com",
      projectId: "credmaster-476d5",
      appId: "1:115740048120:web:542f876e634cff2861990d"
    };

    const login = document.querySelector("#login");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const loginButton = document.querySelector("#login-button");
    const resetButton = document.querySelector("#reset-password");
    const loginMessage = document.querySelector("#login-message");
    const main = document.querySelector("main");
    const nav = main.querySelector("nav");
    const logout = document.querySelector("#logout");
    const overdueAlert = document.querySelector("#overdue-alert");
    const overdueList = document.querySelector("#overdue-list");
    const status = document.querySelector("#status");
    const view = document.querySelector("#view");
    const emptyState = () => ({ revision: 0, clientes: [], emprestimos: [], pagamentos: [], movimentosSaldo: [] });
    const formatter = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const money = cents => formatter.format(cents / 100);
    const localDate = new Intl.DateTimeFormat("sv-SE", { timeZone: "America/Sao_Paulo" });
    const today = () => localDate.format();
    const displayDate = iso => iso.split("-").reverse().join("/");
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);
    const loanNumber = id => String(id).padStart(3, "0");
    const card = (title, body) => `<section class="card"><h2>${title}</h2>${body}</section>`;
    const action = (label, name, id, style = "secondary") =>
      `<button type="button" class="${style}" data-action="${name}" data-id="${id}">${label}</button>`;
    const active = loan => !loan.quitado;
    const validPrincipal = principal => Number.isSafeInteger(principal * 10_000) && principal > 0;
    const interest = loan => Math.round(loan.principal * loan.taxa / 10_000);
    const currentInterest = loan => loan.jurosFixadosNoVencimento ?? interest(loan);
    const hasCurrentPayment = (loan, payments = records.pagamentos) =>
      payments.some(payment => payment.eid === loan.id && payment.vencimento === loan.vencimento
        && !payment.principal);
    const lateDays = (due, day) => Math.max(0, (Date.parse(day) - Date.parse(due)) / 86_400_000);
    const penalty = (due, day) => lateDays(due, day) * 1000;
    const sum = (items, field) => items.reduce((total, item) => total + item[field], 0);
    const nextId = items => items.reduce((max, item) => Math.max(max, item.id), 0) + 1;
    const documentTypes = { identidade: "Foto do documento", endereco: "Comprovante de endereço", renda: "Contracheque" };
    const partSize = 512 * 1024;
    const maxParts = 6;
    const balanceTitles = {
      saldos: "Entrada de dívida",
      injecao: "Valores em aberto Injeção MinasMolde",
      ferramentaria: "Valores em aberto Ferramentaria MinasMolde"
    };
    const movementLabels = {
      entrada: "Entrada de dívida",
      recebimento: "Pagamento recebido",
      abatimento: "Abatimento"
    };

    let auth;
    let cloud;
    let session;
    let records;
    let currentTab = "novo";
    let saving = false;
    let clientFilter = "";
    let reportClient = 0;
    let paymentLoan = 0;
    let activeClientEdit = 0;
    let principalEdit;
    let receivedInterestEdit;
    let activeClientDelete = 0;
    let showArchivedClients = false;

    function dueDate(start, monthOffset) {
      const [year, month, day] = start.split("-").map(Number);
      const first = new Date(0);
      first.setUTCFullYear(year, month - 1 + monthOffset, 1);
      const end = new Date(first);
      end.setUTCMonth(first.getUTCMonth() + 1, 0);
      const lastDay = end.getUTCDate();
      first.setUTCDate(Math.min(day, lastDay));
      return first.toISOString().slice(0, 10);
    }

    function setStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle("danger", error);
    }

    function clientName(id) {
      return records.clientes.find(client => client.id === id)?.nome ?? "Cliente";
    }

    const penaltyWaived = loan => loan.multaDispensadaVencimento === loan.vencimento;

    function cycleBalance(loan, date, payments = records.pagamentos) {
      const cycle = payments.filter(payment => payment.eid === loan.id
        && payment.vencimento === loan.vencimento && !payment.principal);
      const pendingInterest = Math.max(0, currentInterest(loan) - sum(cycle, "juros"));
      const lastPayment = cycle.reduce((last, payment) => payment.data > last ? payment.data : last, "");
      const lastInterest = cycle.reduce((last, payment) => payment.juros && payment.data > last ? payment.data : last, "");
      const penaltyDate = pendingInterest === 0 && lastInterest ? lastInterest : date;
      return {
        juros: pendingInterest,
        multa: penaltyWaived(loan) ? 0 : Math.max(0, penalty(loan.vencimento, penaltyDate) - sum(cycle, "multa")),
        lastPayment
      };
    }

    function matchesClient(client) {
      const query = clientFilter.trim().toLocaleLowerCase("pt-BR");
      const document = String(client.documento ?? "").replace(/\D/g, "");
      const digits = query.replace(/\D/g, "");
      return client.nome.toLocaleLowerCase("pt-BR").includes(query)
        || Boolean(digits && /^[\d.\-/\s]+$/.test(query) && document.includes(digits));
    }

    function renderOverdueAlert() {
      const day = today();
      const overdue = (records?.emprestimos ?? [])
        .filter(loan => active(loan) && loan.vencimento < day)
        .sort((a, b) => a.vencimento.localeCompare(b.vencimento));
      overdueAlert.hidden = overdue.length === 0;
      overdueList.innerHTML = overdue.map(loan => {
        const days = lateDays(loan.vencimento, day);
        const duration = days === 1 ? "1 dia" : `${days} dias`;
        return `<li><mark>${escapeHtml(clientName(loan.cid))}</mark> · nº ${escapeHtml(loanNumber(loan.id))} · ${duration} de atraso</li>`;
      }).join("");
    }

    function render() {
      renderOverdueAlert();
      view.inert = saving;
      if (!records) {
        view.replaceChildren();
        return;
      }
      const selectedTab = currentTab === "saldos" ? "dados" : currentTab;
      nav.querySelectorAll("button").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.tab === selectedTab));
      });
      const hasDraft = view.contains(document.activeElement) && document.activeElement.matches("input, select, textarea");
      if (hasDraft) return;
      const pages = { novo: newLoan, clientes: clients, emprestimos: loans, cobrancas: charges,
        relatorios: reports, dados: dataPage };
      view.innerHTML = Object.hasOwn(balanceTitles, currentTab) ? balances(currentTab) : pages[currentTab]();
    }

    const clientMovements = (state, clientId, sector) =>
      (state.movimentosSaldo ?? []).filter(movement => movement.cid === clientId
        && (sector === undefined || (movement.setor ?? "saldos") === sector));
    const debtBalance = movements => movements.reduce((balance, movement) =>
      balance + (movement.tipo === "entrada" ? movement.valor : -movement.valor), 0);
    const hasOpenDebt = (state, clientId) => debtBalance(clientMovements(state, clientId)) > 0;
    const hasOpenBalance = (state, clientId) => hasOpenDebt(state, clientId)
      || state.emprestimos.some(loan => loan.cid === clientId && active(loan));

    function balanceAmountField(id, label) {
      return `<label for="${id}">${label} (R$)</label>
        <input id="${id}" name="valor" inputmode="decimal" maxlength="18" placeholder="0,00" required>`;
    }

    function balanceNoteField(id) {
      return `<label for="${id}">Observação (opcional)</label>
        <textarea class="balance-note-input" id="${id}" name="observacao" rows="2" maxlength="500"></textarea>`;
    }

    function balances(sector) {
      const available = records.clientes.filter(client => !client.arquivado)
        .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
      const options = available.map(client => `<option value="${client.id}">${escapeHtml(client.nome)}
        ${client.documento ? ` · ${escapeHtml(client.documento)}` : ` · Cadastro nº ${client.id}`}</option>`).join("");
      const entries = card(balanceTitles[sector], `
        ${sector === "saldos" ? '<p class="muted">Lance aqui os saldos que deseja controlar manualmente. Para pagar juros ou quitar um empréstimo cadastrado, use Cobranças.</p>' : ""}
        <form data-form="debt-entry">
          <label for="debt-client">Cliente</label>
          <select id="debt-client" name="cid" required>
            <option value="">Selecione o cliente</option>
            ${options}
            <option value="new">Cadastrar novo nome</option>
          </select>
          <div id="debt-new-client" hidden>
            <label for="debt-name">Nome do cliente</label>
            <input id="debt-name" name="nome" maxlength="120" disabled>
          </div>
          ${balanceAmountField("debt-entry-value", "Valor da dívida")}
          ${balanceNoteField("debt-entry-note")}
          <button type="submit">Registrar entrada</button>
        </form>`);
      const reductions = sector === "saldos"
        ? [{ type: "abatimento", title: "Abater pagamento", label: "Valor recebido", submit: "Registrar abatimento" }]
        : [
          { type: "recebimento", title: "Receber pagamento", label: "Valor recebido", submit: "Registrar recebimento" },
          { type: "abatimento", title: "Registrar abatimento", label: "Valor do desconto ou crédito", submit: "Confirmar abatimento" }
        ];
      const clientCards = records.clientes.map(client => {
        const movements = clientMovements(records, client.id, sector);
        return { client, movements, balance: debtBalance(movements) };
      }).filter(item => item.movements.length)
        .sort((a, b) => Number(b.balance > 0) - Number(a.balance > 0)
          || a.client.nome.localeCompare(b.client.nome, "pt-BR"))
        .map(({ client, movements, balance }) => card(escapeHtml(client.nome), `
          <p class="${balance > 0 ? "danger" : "good"}">${balance > 0 ? "Saldo devedor" : "Quitado"}
            <strong>${money(balance)}</strong></p>
          <div class="balance-actions">
            ${balance > 0 ? reductions.map(({ type, title, label, submit }) => `<details>
              <summary>${title}</summary>
              <form data-form="debt-payment" data-id="${client.id}" data-movement="${type}">
                ${balanceAmountField(`debt-${type}-${client.id}`, label)}
                ${balanceNoteField(`debt-note-${type}-${client.id}`)}
                <button class="green" type="submit">${submit}</button>
              </form>
            </details>`).join("") : ""}
            <details>
              <summary>Histórico (${movements.length})</summary>
              <ul class="balance-history">${movements.reverse().map(movement => `
                <li>
                  ${displayDate(movement.data)} · ${movementLabels[movement.tipo]} ${movement.tipo === "entrada" ? "+" : "−"}${money(movement.valor)}
                  ${movement.observacao ? `<span class="balance-note">Observação · ${escapeHtml(movement.observacao)}</span>` : ""}
                </li>`).join("")}</ul>
              ${sector === "injecao" ? `<details>
                <summary class="danger">Limpar lançamentos de Injeção</summary>
                <form data-form="clear-injection" data-id="${client.id}" data-revision="${records.revision}">
                  <p>Excluir definitivamente os ${movements.length} lançamento(s) de Injeção de <strong>${escapeHtml(client.nome)}</strong>?
                    O saldo de Injeção volta a zero e o cadastro do cliente é mantido.</p>
                  <label for="clear-injection-${client.id}">Digite LIMPAR INJEÇÃO para confirmar</label>
                  <input id="clear-injection-${client.id}" name="confirmacao" autocomplete="off" spellcheck="false" required>
                  <button class="red" type="submit">Confirmar limpeza</button>
                  <p class="danger" data-clear-error role="alert"></p>
                </form>
              </details>` : ""}
            </details>
          </div>`)).join("");
      return entries + (clientCards || card("Saldos por cliente", "<p>Nenhum saldo lançado.</p>"));
    }

    function recordDebtMovement(form, fields) {
      const sector = currentTab;
      if (!Object.hasOwn(balanceTitles, sector)) return;
      const isEntry = form.dataset.form === "debt-entry";
      const isReceipt = !isEntry && sector !== "saldos" && form.dataset.movement === "recebimento";
      const tipo = isEntry ? "entrada" : isReceipt ? "recebimento" : "abatimento";
      const newClient = isEntry && fields.get("cid") === "new";
      const clientId = Number(isEntry ? fields.get("cid") : form.dataset.id);
      const nome = newClient ? fields.get("nome").trim() : "";
      const observacao = String(fields.get("observacao") ?? "").trim();
      if (observacao.length > 500) return setStatus("A observação deve ter até 500 caracteres.", true);
      const input = String(fields.get("valor")).trim();
      const normalized = input.replace(/\.(?=\d{3}(?:\.|,|$))/g, "").replace(",", ".");
      const valor = Math.round(Number(normalized) * 100);
      const format = /^(?:\d+(?:[,.]\d{1,2})?|\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?)$/;
      if (!format.test(input) || !validPrincipal(valor)) {
        return setStatus("Informe um valor maior que zero, com até duas casas decimais.", true);
      }
      const client = records.clientes.find(item => item.id === clientId);
      if (newClient ? !nome : !client || (isEntry && client.arquivado)) {
        return setStatus("Selecione o cliente ou informe o nome para o novo cadastro.", true);
      }
      const balance = debtBalance(clientMovements(records, clientId, sector));
      if (!isEntry && valor > balance) {
        const label = isReceipt ? "O recebimento" : "O abatimento";
        return setStatus(`${label} não pode ser maior que o saldo de ${money(balance)}.`, true);
      }
      if (isEntry && !validPrincipal(balance + valor)) {
        return setStatus("O valor excede o limite de saldo por cliente.", true);
      }
      const data = today();
      return save(next => {
        let cid = clientId;
        if (newClient) {
          cid = nextId(next.clientes);
          next.clientes.push({ id: cid, nome, documento: "", endereco: "", status: "pendente" });
        }
        next.movimentosSaldo ??= [];
        const movement = { cid, setor: sector, tipo, valor, data };
        if (observacao) movement.observacao = observacao;
        next.movimentosSaldo.push(movement);
      });
    }

    async function clearInjectionMovements(form, fields) {
      const clientId = Number(form.dataset.id);
      if (currentTab !== "injecao" || !records.clientes.some(client => client.id === clientId)) return;
      if (Number(form.dataset.revision) !== records.revision) {
        view.replaceChildren();
        render();
        return setStatus("Os dados mudaram. Confira o histórico de Injeção antes de tentar novamente.", true);
      }
      const confirmation = String(fields.get("confirmacao") ?? "").trim().toLocaleUpperCase("pt-BR");
      if (confirmation !== "LIMPAR INJEÇÃO") {
        form.querySelector("[data-clear-error]").textContent = "Digite LIMPAR INJEÇÃO para confirmar.";
        return;
      }
      const saved = await save(next => {
        next.movimentosSaldo = (next.movimentosSaldo ?? [])
          .filter(movement => movement.cid !== clientId || movement.setor !== "injecao");
      });
      if (saved) setStatus("Lançamentos de Injeção apagados. O cliente pode receber novos lançamentos.");
    }

    function clients() {
      return deleteConfirmation() + card(showArchivedClients ? "Clientes arquivados" : "Localizar cliente", `
        <p>Clientes arquivados mantêm os documentos e todo o histórico. Restaure o cadastro para fazer um novo empréstimo.</p>
        ${action(showArchivedClients ? "Voltar aos clientes ativos" : "Ver clientes arquivados", "toggle-archived-clients", 0)}
        <form data-form="search">
          <label for="search-client">Nome ou número do documento</label>
          <input id="search-client" name="busca" value="${escapeHtml(clientFilter)}">
          <button>Buscar</button>
          <button class="secondary" type="button" data-action="clear-search">Limpar</button>
        </form>`) + card("Novo cadastro para análise", clientForm())
        + (records.clientes.filter(client => Boolean(client.arquivado) === showArchivedClients).filter(matchesClient).map(client => card(escapeHtml(client.nome), `
        <p class="${client.status === "aprovado" ? "good" : "danger"}">${client.arquivado ? "ARQUIVADO · " : ""}${escapeHtml(client.status.toUpperCase())}</p>
        ${activeClientEdit === client.id ? clientForm(client) : `
          ${client.documento ? `<p>Documento ${escapeHtml(client.documento)}</p>` : ""}
          ${client.endereco ? `<p>Endereço ${escapeHtml(client.endereco)}</p>` : ""}
          ${client.arquivado ? action("Restaurar cliente", "restore-client", client.id, "green")
            : !hasOpenBalance(records, client.id)
              ? action("Arquivar cliente quitado", "archive-client", client.id) : ""}
          ${action("Editar cadastro", "edit-client", client.id)}
          ${clientFiles(client)}
        `}
        ${action("Apagar cliente", "delete-client", client.id, "red")}
        ${client.status === "pendente" ? `<div class="actions">
          ${action("Aprovar", "approve", client.id, "green")}
          ${action("Recusar", "reject", client.id, "red")}
        </div>` : ""}`)).join("") || card("Clientes", "<p>Nenhum cliente encontrado.</p>"));
    }

    function deleteConfirmation() {
      const client = records.clientes.find(item => item.id === activeClientDelete);
      if (!client) return "";
      const loans = records.emprestimos.filter(item => item.cid === client.id);
      if (hasOpenBalance(records, client.id)) {
        const openTabs = [
          ...(loans.some(active) ? ["Empréstimos"] : []),
          ...[
            ["saldos", "Dados → Saldo devedor antigo"],
            ["injecao", "Valores em aberto Injeção MinasMolde"],
            ["ferramentaria", "Valores em aberto Ferramentaria MinasMolde"]
          ].filter(([sector]) => debtBalance(clientMovements(records, client.id, sector)) > 0)
            .map(([, title]) => title)
        ];
        return card("Exclusão bloqueada", `
          <p id="delete-blocked" class="danger" tabindex="-1">${escapeHtml(client.nome)} tem valores em aberto. Confira as seguintes abas:</p>
          <ul>${openTabs.map(title => `<li>${title}</li>`).join("")}</ul>

    function monthlyStatement(loan, transactions, day) {
      const receipts = new Map();
      for (const payment of transactions) {
        if (payment.principal) continue;
        const cycle = receipts.get(payment.vencimento) ?? [];
        cycle.push(payment);
        receipts.set(payment.vencimento, cycle);
      }

      const rows = [];
      for (let month = 1; ; month++) {
        const due = month === loan.mesVencimento ? loan.vencimento : dueDate(loan.data, month);
        const cycle = receipts.get(due) ?? [];
        if (loan.quitado && (month > loan.mesVencimento || (month === loan.mesVencimento && !cycle.length))) break;
        const paidInterest = sum(cycle, "juros");
        const paidPenalty = sum(cycle, "multa");
        const paid = month < loan.mesVencimento;
        const monthlyInterest = paid ? paidInterest : month === loan.mesVencimento
          ? currentInterest(loan) : interest(loan);
        const status = paid ? "Pago" : loan.quitado ? "Encerrado na quitação"
          : due < day ? "Em atraso" : due === day ? "Vence hoje" : "A vencer";
        const waived = cycle.some(payment => payment.multaDispensada)
          || (month === loan.mesVencimento && penaltyWaived(loan));
        const balance = month === loan.mesVencimento ? cycleBalance(loan, day, cycle)
          : { juros: monthlyInterest, multa: penalty(due, day) };
        rows.push(`<article><p><strong>${displayDate(due)} · ${status}</strong><br>
          Juros previstos ${money(monthlyInterest)} · Juros recebidos ${money(paidInterest)}<br>
          Multa recebida ${money(paidPenalty)}${waived ? " · Multa dispensada" : ""}
          ${paid || loan.quitado ? "" : `<br>Juros em aberto ${money(balance.juros)} · Multa em aberto ${money(balance.multa)}`}</p></article>`);
        if (month >= loan.mesVencimento && due > day) break;
      }
      return `<details><summary>Vencimentos mês a mês</summary>
        ${rows.join("") || '<p>Nenhum vencimento mensal concluído.</p>'}</details>`;
    }

    function editableInterestPayment(payment) {

      return Boolean(loan && payment.vencimento < loan.vencimento);

    function downloadBlob(blob, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    function download(data, prefix) {
      downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), `${prefix}-${today()}.json`);
    }

    function attachmentRefs(current, clientId, kind) {
      if (!Object.hasOwn(documentTypes, kind) || !records.clientes.some(client => client.id === clientId)) return;
      const manifest = cloud.doc(current.ref, "anexos", `${clientId}-${kind}`);
      const part = index => cloud.doc(manifest, "partes", String(index));
      return { manifest, part };
    }

    function storedPartCount(snapshot) {
      if (!snapshot.exists()) return 0;
      const { count } = snapshot.data();
      if (!Number.isInteger(count) || count < 1 || count > maxParts) throw new Error("INVALID_ATTACHMENT");
      return count;
    }

    function attachmentType(bytes) {
      if ([37, 80, 68, 70, 45].every((byte, index) => bytes[index] === byte)) return "application/pdf";
      if ([255, 216, 255].every((byte, index) => bytes[index] === byte)) return "image/jpeg";
      if ([137, 80, 78, 71, 13, 10, 26, 10].every((byte, index) => bytes[index] === byte)) return "image/png";
      return "";
    }

    async function handleAttachment(clientId, kind, file) {
      const current = session;
      if (!current || saving) return;
      const refs = attachmentRefs(current, clientId, kind);
      if (!refs) return;
      const revision = records.revision;
      if (file && (!file.size || file.size > partSize * maxParts)) {
        return setStatus("Escolha um arquivo de até 3 MB.", true);
      }
      saving = true;
      view.inert = true;
      setStatus(file ? "Salvando documento…" : "Carregando documento…");
      try {
        if (file) {
          const bytes = new Uint8Array(await file.arrayBuffer());
          const type = attachmentType(bytes);
          if (!type) return setStatus("Escolha um PDF, JPG ou PNG válido.", true);
          if (session !== current) return;
          const count = Math.ceil(bytes.length / partSize);
          const extension = { "application/pdf": "pdf", "image/jpeg": "jpg", "image/png": "png" }[type];
          await cloud.runTransaction(cloud.instance, async transaction => {
            const clientState = (await transaction.get(current.ref)).data();
            if (clientState?.revision !== revision || !clientState.clientes.some(client => client.id === clientId)) {
              throw new Error("STALE");
            }
            const previous = storedPartCount(await transaction.get(refs.manifest));
            for (let index = 0; index < count; index++) {
              const data = cloud.Bytes.fromUint8Array(bytes.subarray(index * partSize, (index + 1) * partSize));
              transaction.set(refs.part(index), { data });
            }
            for (let index = count; index < previous; index++) transaction.delete(refs.part(index));
            transaction.set(refs.manifest, { count, type, extension });
          });
          if (session === current) setStatus("Documento salvo no Firestore.");
        } else {
          const result = await cloud.runTransaction(cloud.instance, async transaction => {
            const manifest = await transaction.get(refs.manifest);
            const count = storedPartCount(manifest);
            if (!count) return;
            const { type, extension } = manifest.data();
            const parts = await Promise.all(Array.from({ length: count }, (_, index) => transaction.get(refs.part(index))));
            const bytes = parts.map(part => part.data()?.data.toUint8Array());
            if (bytes.some(part => !part)) throw new Error("INVALID_ATTACHMENT");
            return { blob: new Blob(bytes, { type }), extension };
          });
          if (session !== current) return;
          if (!result) return setStatus("Ainda não há arquivo salvo para este campo.");
          downloadBlob(result.blob, `${kind}-cliente-${clientId}.${result.extension}`);
          setStatus("Documento baixado.");
        }
      } catch (error) {
        if (session === current) setStatus(error.message === "STALE"
          ? "O cadastro mudou em outra aba ou aparelho. Confira o cliente antes de enviar novamente."
          : error.code === "permission-denied"
          ? "O Firestore recusou o acesso ao documento. Confira as regras para anexos."
          : "Não foi possível concluir a operação com o documento.", true);
      } finally {
        if (session === current) {
          saving = false;
          view.inert = false;
        }
      }
    }

    function exportLocal() {
      try {
        const raw = localStorage.getItem("jurocontrol_demo_v1");
        if (!raw) return setStatus("Nenhum dado antigo encontrado neste navegador.");
        download({ dados: JSON.parse(raw) }, "credmaster-prototipo");
      } catch {
        setStatus("Não foi possível ler os dados do protótipo.", true);
      }
    }

    function startSession(user) {
      session?.unsubscribe?.();
      session = undefined;
      records = undefined;
      currentTab = "novo";
      clientFilter = "";
      reportClient = 0;
      receivedInterestEdit = undefined;
      principalEdit = undefined;
      activeClientEdit = 0;
      activeClientDelete = 0;
      showArchivedClients = false;
      paymentLoan = 0;
      saving = false;
      const authorized = user?.uid === ownerUid;
      main.hidden = !authorized;
      login.hidden = authorized;
      loginButton.disabled = Boolean(user);
      resetButton.disabled = Boolean(user);
      nav.hidden = true;
      render();
      if (!authorized) {
        if (user) {
          loginMessage.textContent = "Esta conta não tem acesso ao CredMaster.";
          auth.signOut(auth.instance).catch(() => {
            loginMessage.textContent = "Acesso bloqueado. Feche esta aba.";
          });
        } else if (loginMessage.textContent === "Carregando login…") {
          loginMessage.textContent = "";
        }
        return;
      }

      const ref = cloud.doc(cloud.instance, "credmaster", ownerUid);
      const current = { ref };
      session = current;
      setStatus("Conectando ao banco de dados…");
      current.unsubscribe = cloud.onSnapshot(ref, { includeMetadataChanges: true }, snapshot => {
        if (session !== current || snapshot.metadata.hasPendingWrites) return;
        if (snapshot.metadata.fromCache) {
          setStatus("Aguardando conexão com o Firestore…");
          return;
        }
        const next = snapshot.exists() ? snapshot.data() : emptyState();
        if (records && next.revision < records.revision) return;
        if (records?.revision === next.revision) {
          if (!saving && status.textContent === "Aguardando conexão com o Firestore…") setStatus("");
          return;
        }
        records = next;
        nav.hidden = false;
        if (!saving) {
          setStatus("");
          render();
        }
      }, error => {
        if (session !== current) return;
        records = undefined;
        nav.hidden = true;
        render();
        setStatus(error.code === "permission-denied"
          ? "O Firestore recusou o acesso. Confira o UID nas regras publicadas."
          : "O banco não carregou. Atualize a página para tentar de novo.", true);
      });
    }

    async function save(update) {
      if (!records || !session || saving) return;
      const current = session;
      const revision = records.revision;
      saving = true;
      view.inert = true;
      setStatus("Salvando no Firestore…");
      try {
        const next = await cloud.runTransaction(cloud.instance, async transaction => {
          const snapshot = await transaction.get(current.ref);
          const latest = snapshot.exists() ? snapshot.data() : emptyState();
          if (latest.revision !== revision) throw new Error("STALE");
          update(latest);
          latest.revision++;
          transaction.set(current.ref, latest);
          return latest;
        });
        if (session !== current) return;
        if (!records || records.revision <= next.revision) records = next;
        view.replaceChildren();
        setStatus("Salvo no Firestore.");
        return true;
      } catch (error) {
        if (session !== current) return;
        if (error.message === "STALE") {
          setStatus("Os dados mudaram em outra aba ou aparelho. Confira os valores e tente de novo.", true);
        } else if (error.code === "permission-denied") {
          setStatus("O Firestore recusou a gravação. Confira as regras publicadas.", true);
        } else {
          setStatus("Não foi possível confirmar a gravação. Confira a conexão e os registros antes de repetir.", true);
        }
      } finally {
        if (session === current) {
          saving = false;
          view.inert = false;
          if (records && records.revision !== revision) render();
        }
      }
    }

    view.addEventListener("change", event => {
      if (event.target.id !== "debt-client") return;
      const section = view.querySelector("#debt-new-client");
      const nameInput = view.querySelector("#debt-name");
      const creating = event.target.value === "new";
      section.hidden = !creating;
      nameInput.disabled = !creating;
      nameInput.required = creating;
      if (creating) nameInput.focus();
    });

    view.addEventListener("submit", event => {
      const form = event.target;
      event.preventDefault();
      if (!records || saving) return;
      const fields = new FormData(form);
      if (form.dataset.form === "debt-entry" || form.dataset.form === "debt-payment") {
        return recordDebtMovement(form, fields);
      }
      if (form.dataset.form === "clear-injection") {
        return clearInjectionMovements(form, fields);
      }
      if (form.dataset.form === "delete-client") {
        return deleteClient(Number(form.dataset.id), fields.get("confirmacao"));
      }
      if (form.dataset.form === "attachment") {
        return handleAttachment(Number(form.dataset.id), form.dataset.kind, fields.get("arquivo"));
      }
      if (form.dataset.form === "search") {
        clientFilter = fields.get("busca");
        view.replaceChildren();
        return render();
      }
      if (form.dataset.form === "client") {
        const id = Number(form.dataset.id);
        const nome = fields.get("nome").trim();
        const documento = fields.get("documento").trim();
        const endereco = fields.get("endereco").trim();
        if (!nome) return setStatus("Informe o nome do cliente.", true);
        return save(next => {
          if (id) {
            Object.assign(next.clientes.find(client => client.id === id), { nome, documento, endereco });
          } else {
            next.clientes.push({ id: nextId(next.clientes), nome, documento, endereco, status: "pendente" });
          }
        }).then(saved => {
          if (!saved || !id) return;
          activeClientEdit = 0;
          render();
        });
      }
      if (form.dataset.form === "payment") {
        return recordPayment(Number(form.dataset.id), fields);
      }
      if (form.dataset.form === "edit-received-interest") {
        return editReceivedInterest(Number(form.dataset.id), fields.get("juros"));
      }
      if (form.dataset.form === "edit-principal") {
        return editPrincipal(Number(form.dataset.id), Math.round(Number(fields.get("principal")) * 100));
      }
      const cid = Number(fields.get("cid"));
      const principal = Math.round(Number(fields.get("principal")) * 100);
      const taxa = Math.round(Number(fields.get("taxa")) * 100);
      const data = fields.get("data");
      const client = records.clientes.find(item => item.id === cid);
      if (client?.status !== "aprovado" || client.arquivado || !validPrincipal(principal)
          || !Number.isInteger(taxa) || taxa < 0 || taxa > 10_000 || !/^\d{4}-\d{2}-\d{2}$/.test(data)) {
        return setStatus("Confira os dados do empréstimo.", true);
      }
      return save(next => next.emprestimos.push({
        id: nextId(next.emprestimos), cid, principal, taxa, data,
        mesVencimento: 1, vencimento: dueDate(data, 1), quitado: false
      }));
    });

    async function editReceivedInterest(index, amount) {
      const payment = records.pagamentos[index];
      if (!editableInterestPayment(payment) || receivedInterestEdit?.index !== index
          || receivedInterestEdit.revision !== records.revision) {
        receivedInterestEdit = undefined;
        view.replaceChildren();
        render();
        return setStatus("O histórico mudou. Abra o pagamento novamente.", true);
      }
      const juros = Math.round(Number(amount) * 100);
      if (amount == null || amount === "" || !Number.isSafeInteger(juros * 10_000)
          || juros < 0 || juros + payment.multa <= 0) {
        return setStatus("Informe um valor válido para os juros recebidos.", true);
      }
      if (juros === payment.juros) {
        receivedInterestEdit = undefined;
        view.replaceChildren();
        render();
        return setStatus("O valor registrado já está correto.");
      }
      const saved = await save(next => {
        const target = next.pagamentos[index];
        target.jurosOriginal ??= target.juros;
        target.juros = juros;
      });
      if (!saved) return;
      receivedInterestEdit = undefined;
      render();
      setStatus("Juros recebidos corrigidos.");
    }

    async function editPrincipal(id, principal) {
      if (!validPrincipal(principal)) return setStatus("Informe um valor principal válido, maior que zero.", true);
      const loan = records.emprestimos.find(item => item.id === id);
      const edit = principalEdit;
      if (!loan || !active(loan) || edit?.id !== id || loan.principal !== edit.original
          || loan.vencimento !== edit.due || hasCurrentPayment(loan) !== edit.keepsCurrentInterest) {
        principalEdit = undefined;
        view.replaceChildren();
        render();
        return setStatus("O empréstimo mudou. Confira o registro antes de editar.", true);
      }
      if (principal === loan.principal) {
        principalEdit = undefined;
        view.replaceChildren();
        render();
        return setStatus("O valor principal já está correto.");
      }
      const saved = await save(next => {
        const target = next.emprestimos.find(item => item.id === id);
        if (!target || !active(target) || target.principal !== edit.original) throw new Error("STALE");
        if (hasCurrentPayment(target, next.pagamentos)) target.jurosFixadosNoVencimento = currentInterest(target);
        target.principal = principal;
      });
      if (!saved) return;
      principalEdit = undefined;
      render();
      setStatus("Valor do empréstimo corrigido.");
    }

    async function recordPayment(id, fields) {
      const loan = records.emprestimos.find(item => item.id === id);
      if (!loan || loan.quitado) return;
      const data = fields.get("data");
      const juros = Math.round(Number(fields.get("juros")) * 100);
      const multa = Math.round(Number(fields.get("multa")) * 100);
      const balance = cycleBalance(loan, data);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(data) || data < loan.data || data > today() || data < balance.lastPayment
          || !Number.isSafeInteger(juros) || !Number.isSafeInteger(multa) || juros < 0 || multa < 0
          || juros > balance.juros || multa > balance.multa) {
        return setStatus("Confira a data e informe valores até o saldo da cobrança nessa data.", true);
      }
      const complete = juros === balance.juros && multa === balance.multa;
      if (juros + multa === 0 && (!complete || data < loan.vencimento)) {
        return setStatus("Informe um valor recebido.", true);
      }
      const saved = await save(next => {
        const target = next.emprestimos.find(item => item.id === id);
        next.pagamentos.push({ eid: id, cid: loan.cid, juros, multa, principal: 0, data, vencimento: loan.vencimento,
          multaDispensada: penaltyWaived(loan), diasAtraso: lateDays(loan.vencimento, data) });
        if (complete) {
          target.mesVencimento++;
          target.vencimento = dueDate(target.data, target.mesVencimento);
          delete target.jurosFixadosNoVencimento;
        }
      });
      if (saved) {
        paymentLoan = 0;
        render();
      }
    }

    function settleLoan(loan) {
      const data = today();
      if (data < loan.data) return setStatus("A quitação deve ocorrer na data do empréstimo ou depois.", true);
      const balance = cycleBalance(loan, data);
      if (loan.vencimento <= data && balance.juros + balance.multa > 0) {
        return setStatus("Registre os juros e encargos em aberto na aba Cobranças antes de quitar o principal.", true);
      }
      if (!confirm(`Confirmar o recebimento de ${money(loan.principal)} e quitar o principal?`)) return;
      return save(next => {
        const target = next.emprestimos.find(item => item.id === loan.id);
        next.pagamentos.push({
          eid: target.id, cid: target.cid, juros: 0, multa: 0,
          principal: target.principal, data, vencimento: target.vencimento
        });
        target.quitado = true;
      });
    }

    view.addEventListener("change", event => {
      const input = event.target;
      if (!records || saving) return;
      if (input.id === "report-client") {
        reportClient = Number(input.value);
        receivedInterestEdit = undefined;
        view.replaceChildren();
        render();
      }
      if (input.id === "pay-date" && input.value) {
        const loan = records.emprestimos.find(item => item.id === paymentLoan);
        if (loan) {
          const { multa } = cycleBalance(loan, input.value);
          input.form.elements.multa.value = (multa / 100).toFixed(2);
        }
      }
    });

    async function archiveClient(clientId, archived) {
      if (!records || !session || saving) return;
      const client = records.clientes.find(item => item.id === clientId);
      if (!client) return;
      if (archived && hasOpenBalance(records, clientId)) {
        return setStatus("Quite os valores em aberto deste cliente antes de arquivar.", true);
      }
      const saved = await save(next => {
        const target = next.clientes.find(item => item.id === clientId);
        if (!target || (archived && hasOpenBalance(next, clientId))) {
          throw new Error("STALE");
        }
        target.arquivado = archived;
      });
      if (saved) {
        activeClientEdit = 0;
        activeClientDelete = 0;
        setStatus(archived
          ? "Cliente arquivado. Consulte em Ver clientes arquivados. Os documentos e pagamentos foram mantidos."
          : "Cliente restaurado. Ele aparece novamente entre os clientes ativos.");
        view.replaceChildren();
        render();
        status.scrollIntoView({ block: "center" });
      }
    }

    view.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button || !records || saving) return;
      const { action: name, id } = button.dataset;
      const number = Number(id);
      if (name === "toggle-archived-clients") {
        showArchivedClients = !showArchivedClients;
        activeClientEdit = 0;
        activeClientDelete = 0;
        clientFilter = "";
        view.replaceChildren();
        return render();
      }
      if (name === "archive-client" || name === "restore-client") {
        return archiveClient(number, name === "archive-client");
      }
      if (name === "delete-client" || name === "cancel-delete-client") {
        activeClientDelete = name === "delete-client" ? number : 0;
        view.replaceChildren();
        render();
        const target = view.querySelector("#delete-confirmation, #delete-blocked");
        if (target) {
          target.focus();
          target.scrollIntoView({ block: "center" });
        }
        return;
      }
      if (name === "clear-tests") {
        if (!session) return;
      if (!confirm(`Excluir definitivamente ${records.clientes.length} cliente(s), ${records.emprestimos.length} empréstimo(s), ${records.pagamentos.length} pagamento(s), ${(records.movimentosSaldo ?? []).length} movimento(s) de saldo devedor e os documentos?\n\nConfirme apenas se todos são testes e você já guardou os dados necessários. Seu e-mail e sua senha serão mantidos.`)) return;
      if (prompt("Para apagar, digite exatamente: APAGAR TESTES") !== "APAGAR TESTES") return;
      return clearTestData(new Map([
        ["confirmacao", "APAGAR TESTES"], ["backup", "on"]
      ]));
      }
      if (name === "export-local") return exportLocal();
      if (name === "export") return download({ dados: records }, "credmaster-nuvem");
      if (name === "open-legacy-balances") {
        currentTab = "saldos";
        view.replaceChildren();
        return render();
      }
      if (name === "fetch-file") return handleAttachment(number, button.dataset.kind);
      if (name === "edit-received-interest" || name === "cancel-received-interest") {
        if (name === "edit-received-interest" && !editableInterestPayment(records.pagamentos[number])) return;
        receivedInterestEdit = name === "edit-received-interest" ? { index: number, revision: records.revision } : undefined;
        view.replaceChildren();
        render();
        view.querySelector("#received-interest")?.focus();
        return;
      }
      if (name === "clear-search" || name === "edit-client" || name === "cancel-edit") {
        if (name === "clear-search") clientFilter = "";
        if (name === "edit-client") activeClientEdit = number;
        if (name === "cancel-edit") activeClientEdit = 0;
        view.replaceChildren();
        return render();
      }
      if (name === "approve" || name === "reject") {
        const client = records.clientes.find(item => item.id === number);
        if (client?.status !== "pendente") return;
        return save(next => {
          next.clientes.find(item => item.id === number).status = name === "approve" ? "aprovado" : "recusado";
        });
      }
      const loan = records.emprestimos.find(item => item.id === number);
      if (!loan || loan.quitado) return;
      if (name === "edit-principal" || name === "cancel-principal-edit") {
        principalEdit = name === "edit-principal" ? {
          id: loan.id, original: loan.principal, due: loan.vencimento, keepsCurrentInterest: hasCurrentPayment(loan)
        } : undefined;
        view.replaceChildren();
        render();
        view.querySelector("#corrected-principal")?.focus();
        return;
      }
      if (name === "toggle-penalty") {
        const cobrar = penaltyWaived(loan);
        if (!confirm(cobrar
          ? "Recolocar a multa deste vencimento? O valor será calculado desde o vencimento atual, descontando a multa já recebida."
          : "Retirar a multa somente deste vencimento? Os dias de atraso e os pagamentos já recebidos serão mantidos. Os próximos vencimentos terão multa normalmente.")) return;
        return save(next => {
          const target = next.emprestimos.find(item => item.id === number);
          if (cobrar) delete target.multaDispensadaVencimento;
          else target.multaDispensadaVencimento = target.vencimento;
        });
      }
      if (name === "pay" || name === "cancel-payment") {
        paymentLoan = name === "pay" ? loan.id : 0;
        view.replaceChildren();
        return render();
      }
      if (name === "whatsapp") return openWhatsAppCharge(loan);
      if (name === "settle") return settleLoan(loan);
    });

    async function openWhatsAppCharge(loan) {
      let message = chargeMessage(loan);
      try {
        await navigator.clipboard.writeText(pixKey);
        setStatus("Chave Pix copiada. Envie a cobrança no WhatsApp e cole a chave em uma nova mensagem.");
      } catch {
        message += "\n\n*Chave Pix*\n" + pixKey;
        setStatus("O navegador bloqueou a cópia automática. A chave Pix está no fim da cobrança.");
      }

      const url = "https://wa.me/?text=" + encodeURIComponent(message);
      const tab = window.open("about:blank", "_blank");
      if (tab) {
        tab.opener = null;
        tab.location.replace(url);
      } else {
        window.location.assign(url);
      }
    }

    function chargeMessage(loan) {
      const day = today();
      const { juros, multa } = cycleBalance(loan, day);
      return [
        `Olá, ${clientName(loan.cid)}!`,
        `Empréstimo nº ${loanNumber(loan.id)}`,
        `Vencimento dos juros ${displayDate(loan.vencimento)}`,
        `Juros em aberto ${money(juros)}`,
        `Dias em atraso ${lateDays(loan.vencimento, day)}`,
        `Encargos calculados ${money(multa)}`,
        `Total em aberto ${money(juros + multa)}`,
        "",
        "Caso já tenha pago, favor enviar o comprovante."
      ].join("\n");
    }

    nav.addEventListener("click", event => {
      const button = event.target.closest("[data-tab]");
      if (!button || !records || saving) return;
      currentTab = button.dataset.tab;
      receivedInterestEdit = undefined;
      principalEdit = undefined;
      view.replaceChildren();
      render();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) renderOverdueAlert();
    });

    await connect();

    async function connect() {
      try {
        const [appSdk, authSdk, firestoreSdk] = await Promise.all([
          import(sdk + "firebase-app.js"),
          import(sdk + "firebase-auth.js"),
          import(sdk + "firebase-firestore.js")
        ]);
        const app = appSdk.initializeApp(config);
        auth = { ...authSdk, instance: authSdk.initializeAuth(app, { persistence: authSdk.browserSessionPersistence }) };
        cloud = { ...firestoreSdk, instance: firestoreSdk.getFirestore(app) };
        auth.onAuthStateChanged(auth.instance, startSession, () => {
          startSession(null);
          loginMessage.textContent = "A sessão não carregou. Atualize a página.";
        });
        document.querySelector("#login-form").addEventListener("submit", async event => {
          event.preventDefault();
          if (loginButton.disabled) return;
          loginButton.disabled = true;
          resetButton.disabled = true;
          loginMessage.textContent = "Entrando…";
          try {
            const { user } = await auth.signInWithEmailAndPassword(auth.instance, email.value.trim(), password.value);
            if (user.uid === ownerUid) loginMessage.textContent = "";
          } catch (error) {
            loginMessage.textContent = error.code === "auth/network-request-failed"
              ? "Falha de conexão. Tente novamente."
              : "Não foi possível entrar. Confira seu e-mail e sua senha.";
          } finally {
            password.value = "";
            loginButton.disabled = Boolean(auth.instance.currentUser);
            resetButton.disabled = loginButton.disabled;
          }
        });
        resetButton.addEventListener("click", async () => {
          if (!email.value || !email.reportValidity()) {
            email.focus();
            loginMessage.textContent = "Informe seu e-mail para redefinir a senha.";
            return;
          }
          resetButton.disabled = true;
          loginButton.disabled = true;
          try {
            await auth.sendPasswordResetEmail(auth.instance, email.value.trim());
            loginMessage.textContent = "Se houver uma conta com esse e-mail, você receberá um link para redefinir a senha.";
          } catch (error) {
            loginMessage.textContent = error.code === "auth/user-not-found"
              ? "Se houver uma conta com esse e-mail, você receberá um link para redefinir a senha."
              : "Não foi possível solicitar a redefinição. Tente novamente.";
          } finally {
            loginButton.disabled = Boolean(auth.instance.currentUser);
            resetButton.disabled = loginButton.disabled;
          }
        });
        logout.addEventListener("click", async () => {
          try {
            await auth.signOut(auth.instance);
            loginMessage.textContent = "Você saiu do CredMaster.";
          } catch {
            setStatus("Não foi possível sair. Feche esta aba para encerrar a sessão.", true);
          }
        });
      } catch {
        loginMessage.textContent = "O login não carregou. Atualize a página e tente novamente.";
      }
    }

    async function deleteClient(clientId, confirmation) {
      if (!records || !session || saving) return;
      const client = records.clientes.find(item => item.id === clientId);
      if (!client) return;
      if (hasOpenBalance(records, clientId)) {
        return setStatus("Quite os valores em aberto antes de apagar este cliente.", true);
      }
      if (String(confirmation ?? "").trim().replace(/\s+/g, " ").toUpperCase() !== "APAGAR CLIENTE") {
        const message = "Digite APAGAR CLIENTE no campo e toque em Confirmar exclusão. Nenhum dado foi apagado.";
        const error = document.querySelector("#delete-error");
        if (error) error.textContent = message;
        setStatus(message, true);
        return;
      }
      const current = session;
      const revision = records.revision;
      saving = true;
      view.inert = true;
      setStatus("Apagando o cliente… Aguarde a confirmação.");
      try {
        const next = await cloud.runTransaction(cloud.instance, async transaction => {
          const snapshot = await transaction.get(current.ref);
          const latest = snapshot.exists() ? snapshot.data() : emptyState();
          if (latest.revision !== revision || !latest.clientes.some(item => item.id === clientId)
              || hasOpenBalance(latest, clientId)) throw new Error("STALE");
          const documents = await Promise.all(Object.keys(documentTypes).map(async kind => {
            const manifest = cloud.doc(current.ref, "anexos", `${clientId}-${kind}`);
            return { manifest, count: storedPartCount(await transaction.get(manifest)) };
          }));
          for (const { manifest, count } of documents) {
            if (count === 0) continue;
            for (let index = 0; index < count; index++) {
              transaction.delete(cloud.doc(manifest, "partes", String(index)));
            }
            transaction.delete(manifest);
          }
          const loanIds = new Set(latest.emprestimos.filter(item => item.cid === clientId).map(item => item.id));
          const cleared = {
            ...latest,
            clientes: latest.clientes.filter(item => item.id !== clientId),
            emprestimos: latest.emprestimos.filter(item => item.cid !== clientId),
            pagamentos: latest.pagamentos.filter(item => item.cid !== clientId && !loanIds.has(item.eid)),
            movimentosSaldo: (latest.movimentosSaldo ?? []).filter(item => item.cid !== clientId),
            revision: latest.revision + 1
          };
          transaction.set(current.ref, cleared);
          return cleared;
        });
        if (session !== current) return;
        // Preserve a newer snapshot if another device has already added data.
        if (!records || records.revision <= next.revision) records = next;
        clientFilter = "";
        reportClient = 0;
        paymentLoan = 0;
        activeClientEdit = 0;
        activeClientDelete = 0;
        currentTab = "clientes";
        setStatus("Cliente, documentos, empréstimos, pagamentos e histórico de saldo devedor apagados.");
      } catch (error) {
        if (session !== current) return;
        setStatus(error.message === "STALE"
          ? "Os dados mudaram em outra aba ou aparelho. Nenhum dado foi apagado por esta operação. Confira e tente novamente."
          : error.message === "INVALID_ATTACHMENT"
          ? "Um documento deste cliente precisa ser conferido antes da exclusão."
          : error.code === "permission-denied"
          ? "A exclusão foi recusada. Nenhum dado foi apagado. Publique as regras atualizadas de exclusão dos anexos."
          : "Não foi possível confirmar a exclusão. Confira a conexão e os registros antes de repetir.", true);
      } finally {
        if (session === current) {
          saving = false;
          view.inert = false;
          view.replaceChildren();
          render();
          status.scrollIntoView({ block: "center" });
        }
      }
    }

    async function clearTestData(fields) {
      if (!records || !session || saving) return;
      if (fields.get("confirmacao") !== "APAGAR TESTES" || !fields.get("backup")) {
        return setStatus("Confirme que são dados de teste e digite APAGAR TESTES.", true);
      }
      // Each client has three attachment slots with at most six parts each.
      // Keep the entire deletion atomic and below Firestore's write limit.
      if (records.clientes.length > 20) {
        return setStatus("Esta limpeza é limitada a 20 clientes de teste por segurança. Nenhum dado foi apagado.", true);
      }
      const current = session;
      const revision = records.revision;
      saving = true;
      view.inert = true;
      setStatus("Apagando os dados de teste… Aguarde a confirmação.");
      try {
        const next = await cloud.runTransaction(cloud.instance, async transaction => {
          const snapshot = await transaction.get(current.ref);
          const latest = snapshot.exists() ? snapshot.data() : emptyState();
          if (latest.revision !== revision) throw new Error("STALE");
          for (const client of latest.clientes) {
            for (const kind of Object.keys(documentTypes)) {
              const manifest = cloud.doc(current.ref, "anexos", `${client.id}-${kind}`);
              for (let index = 0; index < maxParts; index++) {
                transaction.delete(cloud.doc(manifest, "partes", String(index)));
              }
              transaction.delete(manifest);
            }
          }
          const cleared = { ...emptyState(), revision: latest.revision + 1 };
          transaction.set(current.ref, cleared);
          return cleared;
        });
        if (session !== current) return;
        // Preserve a newer snapshot if another device has already added data.
        if (!records || records.revision <= next.revision) records = next;
        clientFilter = "";
        reportClient = 0;
        paymentLoan = 0;
        activeClientEdit = 0;
        currentTab = "dados";
        setStatus("Dados de teste apagados. Seu acesso foi mantido. Você já pode cadastrar clientes reais.");
      } catch (error) {
        if (session !== current) return;
        setStatus(error.message === "STALE"
          ? "Os dados mudaram em outra aba ou aparelho. Nenhum dado foi apagado por esta operação. Confira e tente novamente."
          : error.code === "permission-denied"
          ? "A limpeza foi recusada. Nenhum dado foi apagado. Publique as regras atualizadas de exclusão dos anexos."
          : "Não foi possível confirmar a limpeza. Confira a conexão e os registros antes de repetir.", true);
      } finally {
        if (session === current) {
          saving = false;
          view.inert = false;
          view.replaceChildren();
          render();
        }
      }
    }

  </script>
